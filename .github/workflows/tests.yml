name: Tests

# Lint et tests automatiques (cahier des charges §20 : testable automatiquement).
# Les tests n'appellent aucun fournisseur réseau : ils utilisent un fournisseur simulé.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests (dont les 13 critères de recette)
        run: pytest -q
