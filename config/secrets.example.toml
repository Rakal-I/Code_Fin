# Copiez ce fichier en config/secrets.toml (jamais versionné) et renseignez vos clés.
# Les variables d'environnement (FINNHUB_API_KEY, ANCORA_GOOGLE_CLIENT_ID…) sont prioritaires.

# Source secondaire (optionnelle) : https://finnhub.io
finnhub_api_key = ""

# Source réglementaire SEC EDGAR (sociétés américaines).
# La SEC exige un User-Agent identifiant le demandeur : "Prénom Nom adresse@exemple.fr".
sec_user_agent = ""

# Connexion avec Google (facultatif) : console.cloud.google.com › API et services › Identifiants
# › « ID client OAuth » de type « Application Web ». URI de redirection à déclarer : voir
# Administration › Paramètres › Connexion Google et Apple.
[google]
client_id = ""
client_secret = ""

# Connexion avec Apple (facultatif, compte Apple Developer requis) : developer.apple.com
# › Certificates, Identifiers & Profiles › Services IDs (« Sign in with Apple ») et Keys.
# Apple n'accepte que des adresses HTTPS avec un nom de domaine (pas localhost).
[apple]
client_id = ""         # Services ID, ex. fr.exemple.ancora.web
team_id = ""
key_id = ""
private_key_path = ""  # chemin du fichier AuthKey_XXXXXXXXXX.p8
